name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Check deployment scripts and config
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          scripts/gen-env.sh ci.example.com ci@example.com
          python -c "import yaml; [yaml.safe_load(open(f)) for f in ('deploy/litellm/config.yaml','deploy/llm-guard/scanners.yml')]"
          for u in deploy/systemd/*.service; do grep -q '^ExecStart=' "$u"; done
      - name: Import check (app starts without services)
        run: python -c "import app.main"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$VM_HOST" ]; then
            echo "VM_HOST secret not set: skipping deploy. See README > Continuous deployment."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VM_KNOWN_HOSTS" ]; then printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "${VM_PORT:-22}" "$VM_HOST" > ~/.ssh/known_hosts; fi
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" "${VM_USER:-airange}@$VM_HOST" \
            "SHA='${{ github.sha }}' bash -s" < scripts/deploy.sh
