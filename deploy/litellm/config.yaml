# LiteLLM gateway. Models and provider keys are added from Admin > LLM gateway (stored in Postgres,
# encrypted with LITELLM_SALT_KEY). You can also pre-define models here; keys come from the environment.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true          # ignore params a provider does not support instead of failing
  request_timeout: 90
