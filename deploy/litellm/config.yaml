# LiteLLM gateway.
# Models below read their keys from /etc/airange/providers.env (see deploy/providers.env.example).
# The model_name is what you put on an agent (Admin > Agents, endpoint "LiteLLM gateway").
# You can still add more models from Admin > LLM gateway; those are stored in Postgres, encrypted with
# LITELLM_SALT_KEY. Don't add a UI model with the same name as one here, or LiteLLM will load-balance
# between the two.
model_list:
  # ---- Claude (ANTHROPIC_API_KEY)
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Gemini (GEMINI_API_KEY)
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # ---- Groq (GROQ_API_KEY). Groq retired its Llama 3.x models on 16 Aug 2026; these are its replacements.
  # Check console.groq.com/docs/deprecations before a class: retired models fail with "model_not_found".
  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      reasoning_effort: low     # gpt-oss thinks before answering; keep it short so replies fit max_tokens
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      reasoning_effort: low     # gpt-oss thinks before answering; keep it short so replies fit max_tokens

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

router_settings:
  # Fail fast on rate limits and outages: the range itself moves the turn to the next model
  # (Admin > LLM gateway > Failover), which is quicker than the gateway retrying with back-off.
  num_retries: 0
  timeout: 60

litellm_settings:
  drop_params: true          # ignore params a provider does not support instead of failing
  request_timeout: 90
